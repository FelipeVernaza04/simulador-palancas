        const estim = estimMsg(k, num(S.m[k]));
        return '<div class="mfield"><div class="mname"><label for="m-' + k + '"><b>' + m[0] + opt + '</b></label><span class="sym">' + m[1] + '</span></div>' +
          '<div class="help">' + m[2] + '</div><div class="inp"><input id="m-' + k + '" data-m="' + k + '" inputmode="decimal" autocomplete="off" value="' + (S.m[k] || "") + '"><span class="u">cm</span></div>' +
          '<div class="hint" id="h-' + k + '">' + estim + "</div></div>";
      }).join("");
    });
    return '<section class="card"><div><h2>Medidas con cinta</h2><p class="lead">' +
      "Para esta técnica se necesitan " + ["", "una", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho"][neededKeys().length] + " medidas." +
      " Mide una vez cada tramo, en centímetros.</p></div>" +
      '<div class="toggle"><input type="checkbox" id="ctl"' + (S.controls ? " checked" : "") + '><label for="ctl">Añadir dos medidas de control (recomendado)</label></div>' +
      '<div class="note" id="closure" ' + (S.controls ? "" : "hidden") + "></div>" + html + "</section>";
  }

  function updateClosure() {
    const el = $("#closure"); if (!el) return;
    if (!S.controls) { el.hidden = true; return; }
    el.hidden = false;
    const raw = getRaw();
    const parts = [];
    let bad = false;
    if (raw.h_troc != null && isFinite(raw.Lt_raw + raw.Ls_raw + raw.ha)) {
      const v = (raw.h_troc - (raw.ha + raw.Ls_raw + raw.Lt_raw)) * 100;
      parts.push("Piernas: " + (Math.abs(v) <= 2 ? "cierran" : "no cierran") + " (diferencia " + nf(v, 1) + " cm, se espera menos de 2). " + (Math.abs(v) <= 2 ? "" : "Revisa Lt, Ls o ha."));
      if (Math.abs(v) > 2) bad = true;
    }
    if (raw.h_troc != null && raw.h_acro != null && isFinite(raw.Ltr_raw)) {
      const v = (raw.h_acro - (raw.h_troc + raw.Ltr_raw)) * 100;
      parts.push("Tronco: " + (Math.abs(v) <= 3 ? "cierra" : "no cierra") + " (diferencia " + nf(v, 1) + " cm, se espera menos de 3). " + (Math.abs(v) <= 3 ? "" : "Revisa Ltr."));
      if (Math.abs(v) > 3) bad = true;
    }
    el.className = "note" + (bad ? " warn" : "");
    el.innerHTML = parts.length ? parts.join("<br>") : "Escribe la altura del trocánter y la del acromion para comprobar que las medidas encajan.";
  }

  // ---------- resultados
  function prepareResults() {
    const raw = getRaw();
    ctx.raw = raw;
    ctx.a = P.fromRaw(raw);
    ctx.set = P.perturbedSet(raw, 200, 7);
    ctx.t = P.TECHNIQUES[S.tech];
    ctx.tB = S.tab === "wi" ? modifiedTech() : (S.compare ? P.TECHNIQUES[S.compare] : null);
    computeView();
    const N = 40; ctx.curve = [];
    const curveSet = ctx.set.slice(0, 80);
    for (let i = 0; i <= N; i++) { const b = P.band(curveSet, ctx.t, S.load, i / N); ctx.curve.push(b.n ? b : null); }
    ctx.curveSet = curveSet; ctx.curveB = null;
    if (S.tab === "wi" && ctx.tB) computeCurveB();
  }
  // ventana de dibujo: cubre todo el recorrido de A (y de B si se compara)
  function computeView() {
    let xs = [], ys = [];
    [ctx.t, ctx.tB].filter(Boolean).forEach((tt) => {
      for (let i = 0; i <= 20; i++) {
        try {
          const q = unfold(P.solve(ctx.a, tt, S.load, i / 20), true);
          Object.values(q.joints).forEach((p) => { xs.push(p[0]); ys.push(p[1]); });
          xs.push(q.joints.cadera[0] + ctx.a.hip_ap_offset, q.bar[0] - 0.225, q.bar[0] + 0.225); ys.push(q.joints.hombro[1] + 0.2);
        } catch (e) { if (!(e instanceof P.Infeasible)) throw e; }
      }
    });
    xs.push(-ctx.raw.Lf / 2, ctx.raw.Lf / 2);
    const x0 = Math.min.apply(null, xs) - 0.06, x1 = Math.max.apply(null, xs) + 0.32;
    ctx.view = { X0: x0, W: Math.round((x1 - x0) * 1000), YT: Math.max.apply(null, ys.concat([0.8])) };
  }
  function computeCurveB() {
    ctx.curveB = [];
    for (let i = 0; i <= 40; i++) { const b = P.band(ctx.curveSet, ctx.tB, S.load, i / 40); ctx.curveB.push(b.n ? b : null); }
  }
  function extendView(tt) {
    let x0 = ctx.view.X0, x1 = ctx.view.X0 + ctx.view.W / 1000, yt = ctx.view.YT;
    for (let i = 0; i <= 10; i++) {
      try {
        const q = unfold(P.solve(ctx.a, tt, S.load, i / 10), true), xs = Object.values(q.joints).map((p) => p[0]).concat([q.bar[0] - 0.225, q.bar[0] + 0.225, q.joints.cadera[0] + ctx.a.hip_ap_offset]);
        x0 = Math.min(x0, Math.min.apply(null, xs) - 0.06); x1 = Math.max(x1, Math.max.apply(null, xs) + 0.32); yt = Math.max(yt, q.joints.hombro[1] + 0.2);
      } catch (e) { if (!(e instanceof P.Infeasible)) throw e; }
    }
    ctx.view = { X0: x0, W: Math.round((x1 - x0) * 1000), YT: yt };
  }

  // ---------- «Qué pasaría si»
  // altura de la cadera al despegar (cm) en función de knee0, para el control «Altura de la cadera»; memoria por atleta y técnica
  let hipTabCache = null;
  function hipTable() {
    if (hipTabCache && hipTabCache.a === ctx.a && hipTabCache.t === ctx.t) return hipTabCache.val;
    const t = ctx.t, pts = [];
    for (let k = -0.12; k <= 0.15001; k += 0.005) {
      try { pts.push([k, P.solve(ctx.a, Object.assign({}, t, { knee0: k }), S.load, 0).joints.cadera[1] * 100]); } catch (e) { if (!(e instanceof P.Infeasible)) throw e; }
    }
    pts.sort((p, q) => p[1] - q[1]);   // altura creciente (la cadera sube al llevar la rodilla hacia atrás)
    const base = P.solve(ctx.a, t, S.load, 0).joints.cadera[1] * 100;
    const kneeFor = (v) => {
      if (!pts.length) return t.knee0;
      if (v <= pts[0][1]) return pts[0][0];
      for (let i = 1; i < pts.length; i++) {
        if (v <= pts[i][1]) { const [k0, y0] = pts[i - 1], [k1, y1] = pts[i]; return y1 === y0 ? k1 : k0 + (k1 - k0) * (v - y0) / (y1 - y0); }
      }
      return pts[pts.length - 1][0];
    };
    const val = { base, min: pts.length ? pts[0][1] : base, max: pts.length ? pts[pts.length - 1][1] : base, kneeFor };
    hipTabCache = { a: ctx.a, t: ctx.t, val };
    return val;
  }

  function ctrlDefs() {
    const t = ctx.t, H = ctx.raw.H, dl = t.exercise === "deadlift";
    const wNow = t.stance === "shoulder" && ctx.a.shoulder_w > 0 ? ctx.a.shoulder_w : t.w_frac * H;
    const stR = dl ? [ctx.a.shoulder_w / H, 73 / 168] : [0.85 * wNow / H, 1.8 * wNow / H];
    const clampR = (b, lo, hi) => [Math.min(lo, b), Math.max(hi, b)];
    const stance = { id: "stance", field: "w_frac", label: "Distancia entre los tobillos", base: wNow * 100, step: 1, toModel: (v) => v / H / 100,
      ends: ["más estrecha", "más ancha"], fmt: (v) => nf(v, 0) + " cm" };
    [stance.lo, stance.hi] = clampR(stance.base, stR[0] * H * 100, stR[1] * H * 100);
    if (dl) {
      const bar = { id: "bar", field: "bar_x_offset", label: "Posición de la barra respecto al medio pie", base: t.bar_x_offset * 100, step: 0.5, toModel: (v) => v / 100,
        ends: ["hacia el talón", "hacia los dedos"], fmt: (v) => (v > 0 ? "+" : "") + nf(v, 1) + " cm" };
      bar.lo = bar.base - 5; bar.hi = bar.base + 5;
      // La altura de la cadera al despegar ya no es un parámetro del modelo: sale de la posición de la rodilla (knee0). El control se
      // mantiene en cm de cadera: se tabula la altura para varias posiciones de rodilla y se invierte.
      const tab = hipTable();
      const hip = { id: "hip", field: "knee0", label: "Altura de la cadera al despegar", base: tab.base, step: 0.5, ends: ["más baja", "más alta"],
        toModel: (v) => tab.kneeFor(v), fmt: (v) => nf(v, 0) + " cm" };
      hip.lo = Math.max(tab.min, tab.base - 10); hip.hi = Math.min(tab.max, tab.base + 6);
      return [bar, hip, stance];
    }
    const depth = { id: "depth", field: "depth_deg", label: "Profundidad del muslo", base: t.depth_deg, step: 0.5, toModel: (v) => v, ends: ["menos profunda", "más profunda"],
      fmt: (v) => (v >= 0 ? nf(v, 0) + "° bajo la horizontal" : nf(-v, 0) + "° sobre la horizontal"), lo: Math.min(-10, t.depth_deg), hi: Math.max(15, t.depth_deg) };
    const shank = { id: "shank", field: "shank_max_deg", label: "Inclinación de la tibia en el fondo", base: t.shank_max_deg, step: 0.5, toModel: (v) => v,
      ends: ["rodillas más atrás", "rodillas más adelante"], fmt: (v) => nf(v, 0) + "°", lo: Math.min(15, t.shank_max_deg), hi: Math.max(40, t.shank_max_deg) };
    return [stance, depth, shank];
  }
  function modifiedTech() {
    const t2 = Object.assign({}, ctx.t, { name: "Con el ajuste" });
    let changed = false;
    ctrlDefs().forEach((d) => { const v = S.wi[d.id]; if (v != null && Math.abs(v - d.base) > 1e-9) { t2[d.field] = d.toModel(v); if (d.field === "w_frac") t2.stance = "frac"; changed = true; } });
    return changed ? t2 : null;
  }
  const CUES = {
    bar: {
      down: ["Barra más pegada a las piernas", "Arrastra la barra por las espinillas y los muslos.", "Jala la barra hacia ti con los dorsales antes de despegar.", "La barra roza las piernas durante todo el recorrido."],
      up: ["Barra más lejos de las piernas", "Arrastra la barra por las espinillas para que no se aleje.", "Jala la barra hacia ti con los dorsales antes de despegar.", "Hay un espacio visible entre la barra y la espinilla al despegar."],
    },
    hip: {
      up: ["Cadera más alta al despegar", "Empuja el suelo hacia abajo con los pies.", "Sube la cadera antes de que la barra se mueva, sin perder la espalda neutra.", "El tronco queda más horizontal y las espinillas más verticales al despegar."],
      down: ["Cadera más baja al despegar", "Empuja el suelo lejos de ti.", "Baja la cadera y flexiona más las rodillas antes de jalar.", "Las rodillas pasan más adelante y el tronco queda más vertical al despegar."],
    },
    stance_dl: {
      up: ["Postura más ancha", "Abre el suelo con los pies.", "Lleva las rodillas hacia afuera, siguiendo la punta de los pies.", "Las rodillas siguen la línea de los pies y la barra recorre menos distancia."],
      down: ["Postura más estrecha", "Empuja el suelo hacia abajo con los pies bajo las caderas.", "Mantén los pies a la anchura de la cadera.", "Los pies quedan bajo las caderas y la barra recorre más distancia."],
    },
    stance_sq: {
      up: ["Postura más ancha", "Abre el suelo con los pies.", "Lleva las rodillas hacia afuera, siguiendo la punta de los pies.", "Las rodillas siguen la dirección de los pies durante todo el descenso."],
      down: ["Postura más estrecha", "Empuja el suelo hacia abajo con los pies bajo las caderas.", "Mantén los pies a la anchura de la cadera.", "Las rodillas siguen la dirección de los pies y los talones no se levantan."],
    },
    depth: {
      up: ["Más profundidad", "Siéntate hacia abajo, entre los talones.", "Sigue bajando hasta que el pliegue de la cadera quede por debajo de la rodilla.", "El pliegue de la cadera queda por debajo de la parte alta de la rodilla."],
      down: ["Menos profundidad", "Siéntate sobre un banco a la altura que quieres.", "Detente cuando los muslos queden paralelos al suelo.", "Los muslos quedan paralelos al suelo en el punto más bajo."],
    },
    shank: {
      up: ["Más avance de las rodillas", "Lleva las rodillas hacia la pared de enfrente, con los talones pegados al suelo.", "Deja que las rodillas pasen sobre la punta de los pies.", "Los talones no se levantan en el punto más bajo."],
      down: ["Menos avance de las rodillas", "Siéntate hacia atrás, hacia la pared de atrás.", "Empuja la cadera hacia atrás al iniciar el descenso.", "Las tibias quedan más verticales y el tronco se inclina más."],
    },
  };
  function peakOf(curve, j) {
    let best = 0;
    curve.forEach((b) => { if (b && Math.abs(b[j][1]) > Math.abs(best)) best = b[j][1]; });
    return best;
  }
  function wiControlsHTML() {
    const defs = ctrlDefs();
    return defs.map((d) => {
      const v = S.wi[d.id] != null ? S.wi[d.id] : d.base;
      return '<div class="wi-ctl"><div class="bl"><label for="wi-' + d.id + '"><b>' + d.label + '</b></label><span class="bv" id="wiv-' + d.id + '">' + d.fmt(v) + "</span></div>" +
        '<input type="range" id="wi-' + d.id + '" data-wi="' + d.id + '" min="' + d.lo + '" max="' + d.hi + '" step="' + d.step + '" value="' + v + '">' +
        '<div class="sl-ends"><span>' + d.ends[0] + "</span><span>" + d.ends[1] + '</span></div><div class="small muted">Valor de la técnica: ' + d.fmt(d.base) + "</div></div>";
    }).join("") + '<div><button type="button" class="linkbtn" id="wi-reset">Restablecer</button></div>';
  }
  function updateWhatIf(r, rB) {
    const el = $("#wi-effect"); if (!el) return;
    if (!ctx.tB) { el.innerHTML = '<p class="muted">Mueve un control para ver cómo cambia la palanca.</p>'; return; }
    if (!rB) { el.innerHTML = '<div class="note bad">Con ese ajuste la postura no es alcanzable en este punto del recorrido. Prueba un valor más cercano al original.</div>'; return; }
    const div = S.perKg ? ctx.raw.mass : 1, unit = S.perKg ? "N·m/kg" : "N·m", dd = S.perKg ? 1 : 0;
    if (!ctx.curveB) computeCurveB();
    const rows = P.JOINTS.map((j) => {
      const pa = peakOf(ctx.curve, j) / div, pb = peakOf(ctx.curveB, j) / div;
      const arm = (j === "lumbar" ? true : true) ? nf(r.arms[j] * 100, 0) + " → " + nf(rB.arms[j] * 100, 0) : "";
      return "<tr><td>" + JN[j] + "</td><td>" + arm + "</td><td>" + nf(pa, dd) + " → " + nf(pb, dd) + "</td></tr>";
    }).join("");
    const ch = [];
    P.JOINTS.forEach((j) => {
      const pa = peakOf(ctx.curve, j), pb = peakOf(ctx.curveB, j), d = Math.abs(pb) - Math.abs(pa);
      if (Math.abs(d) >= Math.max(10, 0.05 * Math.abs(pa))) ch.push((d < 0 ? "baja" : "sube") + " en " + JN[j].toLowerCase() + " (" + (d > 0 ? "+" : "−") + nf(Math.abs(d) / div, dd) + " " + unit + " en valor absoluto)");
    });
    const summary = ch.length ? "El pico de demanda " + ch.join("; ") + "." : "Con este ajuste el pico de demanda casi no cambia en ninguna articulación.";
    const defs = ctrlDefs();
    const cues = defs.map((d) => {
      const v = S.wi[d.id]; if (v == null) return null;
      const rel = (v - d.base) / (d.hi - d.lo);
      if (Math.abs(rel) < 0.08) return null;
      const key = d.id === "stance" ? (exercise() === "deadlift" ? "stance_dl" : "stance_sq") : d.id;
      return { rel: Math.abs(rel), c: CUES[key][rel > 0 ? "up" : "down"] };
    }).filter(Boolean).sort((x, y) => y.rel - x.rel).slice(0, 3);
    const cueHTML = cues.map((q) => '<div class="cue"><div class="eyebrow">Indicación sugerida</div><div class="q">' + q.c[0] + "</div><p><b>Foco externo:</b> «" + q.c[1] + "»</p><p><b>Alternativa interna:</b> " + q.c[2] + "</p><p><b>Qué mirar:</b> " + q.c[3] + "</p></div>").join("");
    el.innerHTML = '<p><b>' + summary + '</b></p><div style="overflow-x:auto"><table class="wi-t"><thead><tr><th>Articulación</th><th>Brazo de la barra (cm), ahora</th><th>Pico en el recorrido (' + unit + ")</th></tr></thead><tbody>" + rows + "</tbody></table></div>" +
      '<div class="small muted">Cada celda muestra «técnica original → con el ajuste». El brazo corresponde a la posición actual del deslizador de recorrido.</div>' + cueHTML +
      (cues.length ? '<div class="small muted">Las indicaciones son sugerencias de trabajo: valídalas con el atleta. La app no sabe si puede ejecutar el ajuste.</div>' : "") +
      '<ul class="small muted" style="margin:0;padding-left:1.1em;display:grid;gap:4px"><li>Cada ajuste se calcula con todo lo demás igual. En la práctica, mover la barra o la cadera también cambia el tronco y los hombros.</li><li>Si baja el momento en una articulación, puede subir en otra: revisa la tabla.</li><li>El modelo no sabe si el atleta tiene la fuerza o la movilidad para ese ajuste.</li><li>Los rangos de los controles son rangos prácticos, no datos publicados. Lejos de las posturas medias calibradas el modelo extrapola.</li></ul>';
  }

  function rightCol() {
    const t = P.TECHNIQUES[S.tech];
    const opts = Object.keys(P.TECHNIQUES).filter((k) => P.TECHNIQUES[k].exercise === t.exercise && k !== S.tech)
      .map((k) => '<option value="' + k + '"' + (S.compare === k ? " selected" : "") + ">" + P.TECHNIQUES[k].name + "</option>").join("");
    const warns = [];
    if (!t.calibrated) warns.push('<div class="note warn">Esta técnica no está calibrada con datos publicados: sus parámetros son ilustrativos.</div>');
    if (S.sex === "F") warns.push('<div class="note warn">Calibración basada en hombres. Interpreta con cautela en mujeres.</div>');
    const tabs = '<div class="tabs" role="group" aria-label="Vista"><button type="button" data-tab="res" aria-pressed="' + (S.tab === "res") + '">Resultados</button><button type="button" data-tab="wi" aria-pressed="' + (S.tab === "wi") + '">Qué pasaría si</button></div>';
    const unitTog = '<div class="unit-tog" role="group" aria-label="Unidad"><button type="button" data-unit="abs" aria-pressed="' + !S.perKg + '">N·m</button><button type="button" data-unit="kg" aria-pressed="' + S.perKg + '">N·m/kg</button></div>';
    const infeas = '<div class="note bad" id="infeasible" hidden>Con estas medidas la postura no es alcanzable en este punto del recorrido. Revisa el brazo, el tronco o la pierna.</div>';
    if (S.tab === "wi") {
      if (!t.calibrated) return tabs + warns.join("") + '<section class="card"><h3>Qué pasaría si</h3><p class="muted">Esta técnica no tiene datos publicados para calibrar, así que no se ofrece el ajuste. Elige otra técnica en el paso 1.</p></section>';
      return tabs + warns.join("") + infeas +
        '<section class="card"><h3>Ajustes</h3><p class="small muted">Mueve un control y mira cómo cambia la palanca. Lo demás se mantiene igual.</p>' + wiControlsHTML() + "</section>" +
        '<section class="card"><h3>Efecto del ajuste</h3><div id="wi-effect" style="display:grid;gap:12px"></div></section>' +
        '<section class="card"><div class="hdr-row"><h3>Demanda en cada articulación</h3>' + unitTog + '</div><div id="bars"></div><div class="small muted" id="takeaway"></div><div id="diff"></div></section>';
    }
    return tabs + warns.join("") + infeas +
      '<section class="card"><div class="hdr-row"><h3>Demanda en cada articulación</h3>' + unitTog + "</div>" +
      '<div class="cmp"><label for="cmp" class="small muted">Comparar con</label><select id="cmp"><option value="">Ninguna</option>' + opts + "</select></div>" +
      '<div id="bars"></div><div class="small muted" id="takeaway"></div><div id="diff"></div></section>' +
      '<section class="card"><h3>Reparto entre tobillo, rodilla y cadera</h3><div id="share"></div></section>' +
      '<section class="card"><h3>Cómo cambia durante el recorrido</h3><div id="chart"></div><div class="small muted">Línea punteada: posición actual del deslizador. Las líneas muestran la mediana de las variaciones simuladas.</div></section>' +
      '<section class="card"><details><summary>Cómo leer estos resultados</summary><ul>' +
      "<li>El momento es el peso multiplicado por su distancia horizontal a la articulación (el brazo de palanca). Indica cuánto debe compensar la musculatura.</li>" +
      "<li>Valores positivos son momentos extensores netos. Un valor negativo indica que el peso empuja esa articulación hacia el lado contrario.</li>" +
      "<li>El modelo es estático, en el plano sagital y con postura simétrica. No incluye aceleración ni diferencias de técnica entre atletas.</li>" +
      "<li>La barra horizontal de cada fila muestra el rango que contiene el 95 % de los resultados al variar los errores de la cinta y la ubicación de la cadera.</li>" +
      "<li>Cerca del bloqueo, estructuras pasivas sostienen parte de la carga. No leas esos momentos como esfuerzo muscular.</li>" +
      "<li>La zona lumbar usa un punto aproximado a un 10 % de la longitud del tronco sobre la cadera.</li></ul></details></section>";
  }
  function refreshRight() {
    $("#right").innerHTML = rightCol();
    prepareResults();
    const ch = $("#chart"); if (ch) ch.innerHTML = chartHTML();
    updateResults();
  }

  function viewResults() {
    const t = P.TECHNIQUES[S.tech];
    const sq = t.exercise === "squat";
    return '<div class="res"><section class="card fig-card"><div class="hdr-row"><h3>' + t.name + '</h3><span class="mono small muted">' + nf(S.load, 0) + " kg</span></div>" +
      '<button type="button" class="btn primary" id="x-open">Explicar con el atleta</button>' +
      '<div class="unit-tog" role="group" aria-label="Plano de la figura"><button type="button" data-plane="sag" aria-pressed="' + (S.plane === "sag") + '">Lateral</button><button type="button" data-plane="front" aria-pressed="' + (S.plane === "front") + '">Frontal</button></div>' +
      '<svg class="fig" id="fig" viewBox="0 0 1000 1900" role="img" aria-label="Figura de palitos con el brazo de palanca de la barra en cada articulación"></svg>' +
      '<div class="unit-tog" id="legtog" role="group" aria-label="Vista de las piernas" style="margin-top:8px"><button type="button" data-lv="real" aria-pressed="' + (S.legView === "real") + '">Piernas reales</button><button type="button" data-lv="lat" aria-pressed="' + (S.legView === "lat") + '">Vista lateral</button></div>' +
      '<p class="small muted" id="fignote" style="margin:6px 0 0"></p>' +
      '<div class="sl"><label for="sl" class="small"><b>Recorrido: <span id="slv">' + Math.round(S.s * 100) + '</span> %</b></label><input type="range" id="sl" min="0" max="1" step="0.005" value="' + S.s + '">' +
      '<div class="sl-ends"><span>' + (sq ? "De pie" : "Barra en el suelo") + "</span><span>" + (sq ? "Fondo" : "Bloqueo") + "</span></div></div>" +
      '<div class="stats" id="stats"></div>' +
      '<p class="small muted" id="fighelp">' + (S.plane === "front" ? FRONT_HELP : SAG_HELP) + '</p></section>' +
      '<div id="right" style="display:grid;gap:16px;min-width:0;align-content:start">' + rightCol() + "</div></div>";
  }

  // --- dibujo de la figura
  // Con postura ancha las piernas se abren hacia los lados: en una vista lateral pura la tibia y el muslo se ven más cortos.
  // «Piernas reales» gira cada punto de la pierna alrededor del eje antero-posterior que pasa por el tobillo hasta ponerlo en el
  // plano sagital: la x no cambia (los brazos de palanca son los mismos) y la tibia queda a su longitud real. La cadera sube a su
  // altura dentro del plano de la pierna, y todo lo que va sobre ella (tronco, cabeza, brazos, barra) se sube lo mismo. Como la
  // rodilla puede abrirse fuera del plano tobillo-cadera (sigue la dirección del pie), el muslo no siempre queda a su longitud real.
  // Solo cambia el dibujo; el cálculo de momentos no se toca.
  function unfold(q, force) {
    if (!force && S.legView !== "real") return q;
    const ha = ctx.a.ha, cp = Math.cos(q.psi_deg * Math.PI / 180), j = q.joints, z = q.lateral;
    const dy = (j.cadera[1] - ha) / cp - (j.cadera[1] - ha);
    const up = (p) => [p[0], p[1] + dy];
    const kneeY = ha + Math.hypot(z.tobillo - z.rodilla, j.rodilla[1] - ha);
    return Object.assign({}, q, {
      joints: { tobillo: j.tobillo, rodilla: [j.rodilla[0], kneeY], cadera: up(j.cadera), hombro: up(j.hombro) },
      bar: up(q.bar), unfold_dy: dy,
    });
  }
  function figNote(r0) {
    const a = ctx.a, j = r0.joints, d = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
    if (S.legView === "real") {
      const u = unfold(r0, true), uj = u.joints;
      const tib = d(uj.tobillo, uj.rodilla) / a.Ls * 100, mus = d(uj.rodilla, uj.cadera) / a.Lt * 100;
      const lift = u.unfold_dy * 100;
      return "Piernas desplegadas sobre el plano lateral: la tibia se ve al " + nf(tib, 0) + " % y el muslo al " + nf(mus, 0) + " % de su longitud real" +
        (mus < 97 ? " (la rodilla se abre hacia afuera siguiendo el pie, por eso el muslo se ve algo más corto)" : "") + ". " +
        (lift >= 1 ? "La cadera y la barra se dibujan " + nf(lift, 0) + " cm más arriba que su altura real (cadera real: " + nf(r0.joints.cadera[1] * 100, 0) + " cm). " : "") +
        "Los brazos de palanca (medidas horizontales) no cambian. En esta vista la altura relativa entre la barra y la rodilla se deforma: la distancia barra-rodilla solo es exacta en la vista lateral.";
    }
    if (r0.psi_deg < 5) return "Postura estrecha: las piernas casi no se inclinan y la vista lateral las muestra a su longitud.";
    const tib = d(j.tobillo, j.rodilla) / a.Ls * 100, mus = d(j.rodilla, j.cadera) / a.Lt * 100;
    return "Vista lateral real: las piernas, abiertas por la separación de los pies y la dirección de las rodillas, se ven más cortas (tibia al " + nf(tib, 0) + " %, muslo al " + nf(mus, 0) + " % de su longitud). Es un efecto de la vista, no de las medidas.";
  }
  function drawFigure(r, rB, opt) {
    const plateY = r.bar[1]; // el disco real apoya en el suelo (peso muerto); en sentadilla acompaña a la barra dibujada
    r = unfold(r); if (rB) rB = unfold(rB);
    const a = ctx.a;
    const X0 = ctx.view.X0, YT = ctx.view.YT;
    const X = (x) => Math.round((x - X0) * 1000), Y = (y) => Math.round((YT - y) * 1000);
    const hipC = (rr) => [rr.joints.cadera[0] + a.hip_ap_offset, rr.joints.cadera[1]];
    const pts = (rr) => {
      const j = rr.joints, sh = j.hombro;
      return { ank: j.tobillo, kn: j.rodilla, hp: j.cadera, sh };
    };
    const line = (p, cls) => '<polyline class="' + cls + '" points="' + p.map((q) => X(q[0]) + "," + Y(q[1])).join(" ") + '"/>';
    const body = (rr, cls, isB) => {
      const p = pts(rr);
      const trunkDir = [p.sh[0] - p.hp[0], p.sh[1] - p.hp[1]];
      const L = Math.hypot(trunkDir[0], trunkDir[1]) || 1;
      const headC = [p.sh[0] + trunkDir[0] / L * 0.11, p.sh[1] + trunkDir[1] / L * 0.11];
      let out = line([p.ank, p.kn, p.hp, p.sh], cls);
      if (exercise() === "deadlift") out += line([p.sh, rr.bar], cls);
      out += '<circle cx="' + X(headC[0]) + '" cy="' + Y(headC[1]) + '" r="' + (isB ? 70 : 78) + '" class="' + (isB ? "seg-b" : "seg-a") + '" style="stroke-width:' + (isB ? 10 : 18) + '"/>';
      return out;
    };
    let g = "";
    g += '<line class="floor" x1="0" x2="' + ctx.view.W + '" y1="' + Y(0) + '" y2="' + Y(0) + '"/>';
    // pie
    const ank = r.joints.tobillo;
    g += '<polyline class="seg-a" style="stroke-width:14" points="' + [[-a.Lf / 2, 0], [a.Lf / 2, 0], [a.Lf / 2 - 0.02, 0.03], [ank[0], ank[1]]].map((q) => X(q[0]) + "," + Y(q[1])).join(" ") + '"/>';
    // disco y plomada
    g += '<circle class="plate" cx="' + X(r.bar[0]) + '" cy="' + Y(exercise() === "deadlift" ? plateY : r.bar[1]) + '" r="225"/>';
    g += '<line class="plumb" x1="' + X(r.bar[0]) + '" x2="' + X(r.bar[0]) + '" y1="' + Y(r.bar[1]) + '" y2="' + Y(0) + '"/>';
    if (rB) g += body(rB, "seg-b", true);
    g += body(r, "seg-a", false);
    g += '<circle cx="' + X(r.bar[0]) + '" cy="' + Y(r.bar[1]) + '" r="20" fill="var(--ink)"/>';
    // articulaciones coloreadas por demanda
    const mm = r.moments, mx = Math.max(1, Math.abs(mm.tobillo), Math.abs(mm.rodilla), Math.abs(mm.cadera), Math.abs(mm.lumbar));
    const heatOf = (name) => (opt && opt.heat ? opt.heat[name] : Math.min(1, Math.abs(mm[name]) / mx));
    const jt = (name, p) => '<circle class="jt" cx="' + X(p[0]) + '" cy="' + Y(p[1]) + '" r="' + (opt && opt.big ? (name === "lumbar" ? 28 : 46) : 30) + '" fill-opacity="' + (0.18 + 0.82 * heatOf(name)).toFixed(2) + '"/>';
    const hc = hipC(r);
    g += '<circle cx="' + X(r.joints.cadera[0]) + '" cy="' + Y(r.joints.cadera[1]) + '" r="13" fill="var(--ink)"/>';
    g += jt("tobillo", r.joints.tobillo) + jt("rodilla", r.joints.rodilla) + jt("cadera", hc);
    const lumbP = [r.joints.cadera[0] + 0.1 * (r.joints.hombro[0] - r.joints.cadera[0]), r.joints.cadera[1] + 0.1 * (r.joints.hombro[1] - r.joints.cadera[1])];
    if (opt && opt.heat) g += jt("lumbar", lumbP);
    // brazos de palanca
    const dimm = (name, p, dy) => {
      const x1 = X(r.bar[0]), x2 = X(p[0]), y = Y(p[1]);
      const arm = r.arms[name] * 100;
      const mid = (x1 + x2) / 2;
      const lab = nf(Math.abs(arm), 0) + " cm";
      const anchor = "middle";
      return '<line class="dim" x1="' + x1 + '" x2="' + x2 + '" y1="' + y + '" y2="' + y + '"/><line class="dim" x1="' + x1 + '" x2="' + x1 + '" y1="' + (y - 16) + '" y2="' + (y + 16) + '"/><line class="dim" x1="' + x2 + '" x2="' + x2 + '" y1="' + (y - 16) + '" y2="' + (y + 16) + '"/>' +
        '<text x="' + mid + '" y="' + (y + dy) + '" text-anchor="' + anchor + '">' + lab + "</text>";
    };
    if (opt && opt.only) {
      const pt = { cadera: hc, rodilla: r.joints.rodilla, tobillo: r.joints.tobillo, lumbar: lumbP }[opt.only];
      g += dimm(opt.only, pt, 70);
    } else {
      if (Math.abs(r.arms.cadera) >= 0.04) g += dimm("cadera", hc, -22);
      if (Math.abs(r.arms.rodilla) >= 0.04) g += dimm("rodilla", r.joints.rodilla, -22);
      if (Math.abs(r.arms.tobillo) >= 0.04) g += dimm("tobillo", r.joints.tobillo, 52);
    }
    if (opt && opt.tag) {
      const pt = { cadera: hc, rodilla: r.joints.rodilla, tobillo: r.joints.tobillo, lumbar: lumbP }[opt.tag.joint];
      const left = X(pt[0]) > ctx.view.W / 2;
      g += '<text class="tagtxt" x="' + (X(pt[0]) + (left ? -64 : 64)) + '" y="' + (Y(pt[1]) - 78) + '" text-anchor="' + (left ? "end" : "start") + '">' + opt.tag.text + "</text>";
    }
    const sx = X(X0 + 0.04), sy = Y(0) + 0;
    g += '<line class="dim" x1="' + sx + '" x2="' + (sx + 200) + '" y1="' + (Y(0) + 30) + '" y2="' + (Y(0) + 30) + '"/><text class="lab" x="' + (sx + 210) + '" y="' + (Y(0) + 42) + '">20 cm</text>';
    g += '<text class="lab" x="' + (X(r.bar[0]) + 240) + '" y="' + (Y(r.bar[1]) + 12) + '">barra</text>';
    if (exercise() === "deadlift" && r.trunk_deg < -2) {
      g += '<text class="lab" x="' + (X(r.bar[0]) + 240) + '" y="' + (Y(lumbP[1]) - 30) + '">extensión ' + nf(-r.trunk_deg, 0) + "°</text>";
    }
    return g;
  }

  // --- vista frontal (esquemática, solo forma: no calcula momentos)
  // Usa las coordenadas del modelo: separación lateral de tobillos, rodillas y caderas (r.lateral), ancho de hombros y las alturas
  // de cada punto. La rodilla sigue la dirección que fija la técnica (knee_out_deg): por eso se mueve hacia el plano medio al
  // extenderse la pierna. Barra y discos van esquematizados (la barra real mide 2,2 m) y los brazos cuelgan verticales desde los hombros.
  const FRONT = { HW: 0.72, barHalf: 0.66, plateIn: 0.56, plateOut: 0.62, footW: 0.10, handOut: 0.035 };
  const SAG_HELP = "Los círculos azules marcan tobillo, rodilla y centro estimado de la cadera: más oscuro, mayor momento. Las líneas horizontales con medida son los brazos de palanca de la barra. El punto pequeño en la cadera es el trocánter. Línea punteada naranja: postura comparada.";
  const FRONT_HELP = "Vista de frente con las medidas del atleta: separación de los pies, ancho de caderas y de hombros, y la posición de la rodilla en cada punto del recorrido. Es un dibujo para explicar la postura; no mide ni evalúa la técnica real. Línea punteada naranja: postura comparada.";
  function drawFront(r, rB) {
    const a = ctx.a, YT = ctx.view.YT, F = FRONT;
    const X = (l) => Math.round((l + F.HW) * 1000), Y = (y) => Math.round((YT - y) * 1000);
    const sh2 = a.shoulder_w / 2, dl = ctx.t.exercise === "deadlift";
    const poly = (p, cls, st) => '<polyline class="' + cls + '"' + (st ? ' style="' + st + '"' : "") + ' points="' + p.map((q) => X(q[0]) + "," + Y(q[1])).join(" ") + '"/>';
    const geom = (q) => {
      const j = q.joints, z = q.lateral;
      return { ha: j.tobillo[1], hipL: z.cadera, ankL: z.tobillo, kneeL: z.rodilla, kY: j.rodilla[1], hY: j.cadera[1], sY: j.hombro[1], bY: q.bar[1], hx: j.cadera[0], sx: j.hombro[0] };
    };
    const body = (q, tech, cls, isB) => {
      const g = geom(q), inside = tech.grip_inside;
      const trunkL = Math.hypot(g.sx - g.hx, g.sY - g.hY) || 1;
      let headY = g.sY + 0.11 * (g.sY - g.hY) / trunkL;
      headY = Math.max(headY, g.sY + 0.09); // con el tronco casi horizontal la cabeza se vería encima de la línea de hombros
      if (!dl) headY = Math.max(headY, g.bY + 0.10); // sentadilla: la barra va en la base del cuello, la cabeza queda por encima
      const toe = tech.toe_out_deg * Math.PI / 180, fw = (F.footW * Math.cos(toe) + a.Lf * Math.sin(toe)) / 2;
      const hand = inside ? sh2 : sh2 + F.handOut; // sumo: agarre por dentro de las piernas; convencional: por fuera de las rodillas
      let o = "";
      [-1, 1].forEach((sg) => {
        o += poly([[sg * g.ankL, g.ha], [sg * g.kneeL, g.kY], [sg * g.hipL, g.hY]], cls);
        o += poly([[sg * (g.ankL - fw), 0], [sg * (g.ankL + fw), 0]], cls, isB ? "" : "stroke-width:14");
        if (dl) o += poly([[sg * sh2, g.sY], [sg * hand, g.bY]], cls);
      });
      o += poly([[-g.hipL, g.hY], [-sh2, g.sY], [sh2, g.sY], [g.hipL, g.hY], [-g.hipL, g.hY]], cls);
      o += '<circle cx="' + X(0) + '" cy="' + Y(headY) + '" r="' + (isB ? 70 : 78) + '" class="' + cls + '" style="stroke-width:' + (isB ? 10 : 18) + '"/>';
      return o;
    };
    const A = geom(r), W = Math.round(2 * F.HW * 1000);
    let g = '<line class="floor" x1="0" x2="' + W + '" y1="' + Y(0) + '" y2="' + Y(0) + '"/>';
    g += '<line class="plumb" x1="' + X(0) + '" x2="' + X(0) + '" y1="0" y2="' + Y(0) + '"/>';
    // barra y discos (esquemáticos)
    const bY = Y(A.bY), pr = 0.225;
    [-1, 1].forEach((sg) => {
      g += '<rect class="plate" x="' + X(sg < 0 ? -F.plateOut : F.plateIn) + '" y="' + Y(A.bY + pr) + '" width="' + Math.round((F.plateOut - F.plateIn) * 1000) + '" height="' + Math.round(2 * pr * 1000) + '" rx="8"/>';
    });
    g += '<line class="seg-a" style="stroke-width:14" x1="' + X(-F.barHalf) + '" x2="' + X(F.barHalf) + '" y1="' + bY + '" y2="' + bY + '"/>';
    if (rB) g += body(rB, ctx.tB, "seg-b", true);
    g += body(r, ctx.t, "seg-a", false);
    // articulaciones (sin color por demanda: esta vista no calcula momentos)
    [-1, 1].forEach((sg) => {
      [[A.ankL, A.ha], [A.kneeL, A.kY], [A.hipL, A.hY]].forEach((p) => { g += '<circle class="jt" cx="' + X(sg * p[0]) + '" cy="' + Y(p[1]) + '" r="26" fill-opacity="0.4"/>'; });
      if (dl) g += '<circle cx="' + X(sg * (ctx.t.grip_inside ? sh2 : sh2 + F.handOut)) + '" cy="' + bY + '" r="20" fill="var(--ink)"/>';
    });
    // medida: separación de tobillos
    const yd = Y(0.07), x1 = X(-A.ankL), x2 = X(A.ankL);
    g += '<line class="dim" x1="' + x1 + '" x2="' + x2 + '" y1="' + yd + '" y2="' + yd + '"/><line class="dim" x1="' + x1 + '" x2="' + x1 + '" y1="' + (yd - 16) + '" y2="' + (yd + 16) + '"/><line class="dim" x1="' + x2 + '" x2="' + x2 + '" y1="' + (yd - 16) + '" y2="' + (yd + 16) + '"/>' +
      '<text x="' + X(0) + '" y="' + (yd - 20) + '" text-anchor="middle">' + nf(2 * A.ankL * 100, 0) + " cm</text>";
    const sx = X(-F.HW + 0.04);
    g += '<line class="dim" x1="' + sx + '" x2="' + (sx + 200) + '" y1="' + (Y(0) + 30) + '" y2="' + (Y(0) + 30) + '"/><text class="lab" x="' + (sx + 210) + '" y="' + (Y(0) + 42) + '">20 cm</text>';
    return g;
  }
  function frontNote(r) {
    const a = ctx.a, t = ctx.t, z = r.lateral, dl = t.exercise === "deadlift";
    const kneeIn = (z.tobillo - z.rodilla) * 100;
    return "Vista frontal esquemática: pies separados " + nf(z.tobillo * 200, 0) + " cm" + (t.toe_out_deg > 0 ? " y abiertos " + nf(t.toe_out_deg, 0) + "°" : ", con los pies rectos") +
      ", caderas " + nf(a.b * 100, 0) + " cm y hombros " + nf(a.shoulder_w * 100, 0) + " cm (medidas del atleta). La rodilla sigue la dirección del pie" +
      (kneeIn >= 1 ? " y queda " + nf(kneeIn, 0) + " cm por dentro de él en este punto" : "") +
      (dl ? "; los brazos cuelgan verticales, " + (t.grip_inside ? "por dentro de las piernas (sumo)" : "por fuera de las rodillas (convencional)") : "") + ". Barra y discos no están a escala.";
  }

  function niceTicks(lo, hi, n) {
    const span = hi - lo || 1, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const f = step0 / mag, step = (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * mag;
    const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v);
    return out;
  }

  function axisHTML(lo, hi, pos, unit) {
    const ticks = niceTicks(lo, hi, 4);
    return '<div class="axis" aria-hidden="true">' + ticks.map((v) => '<span style="left:' + pos(v) + '%">' + nf(v, S.perKg ? 1 : 0) + "</span>").join("") + '</div><div class="axis-t">' + unit + " (positivo: extensor)</div>";
  }
  function barsHTML(bA, bB, r) {
    const div = S.perKg ? ctx.raw.mass : 1;
    const js = P.JOINTS;
    let lo = 0, hi = 0;
    js.forEach((j) => { [bA, bB].forEach((b) => { if (b) { lo = Math.min(lo, b[j][0] / div); hi = Math.max(hi, b[j][2] / div); } }); });
    const pad = (hi - lo) * 0.04 || 1; lo -= pad * (lo < 0 ? 1 : 0); hi += pad;
    const pos = (v) => ((v - lo) / (hi - lo)) * 100;
    const d = S.perKg ? 1 : 0;
    const unit = S.perKg ? "N·m/kg" : "N·m";
    const order = ["tobillo", "rodilla", "cadera", "lumbar"];
    return order.map((j) => {
      const row = (b, cls, t1) => {
        const [l, m, h] = b[j].map((v) => v / div);
        const x0 = Math.min(0, m), x1 = Math.max(0, m);
        return '<div class="bar ' + cls + '" style="left:' + pos(x0) + "%;width:" + Math.max(0.4, pos(x1) - pos(x0)) + '%"></div>' +
          '<div class="wh ' + t1 + '" style="left:' + pos(l) + "%;width:" + (pos(h) - pos(l)) + '%"></div>' +
          '<div class="cap ' + t1 + '" style="left:' + pos(l) + '%"></div><div class="cap ' + t1 + '" style="left:calc(' + pos(h) + '% - 2px)"></div>';
      };
      const fmt = (b) => nf(b[j][1] / div, d) + " " + unit + ' <small>(' + nf(b[j][0] / div, d) + " a " + nf(b[j][2] / div, d) + " " + unit + ")</small>";
      return '<div class="brow"><div class="bl"><b>' + JN[j] + '</b> <span class="muted small">brazo ' + nf(r.arms[j] * 100, 0) + ' cm</span><span class="bv">' + fmt(bA) + (bB ? '<br><span style="color:var(--alt)">' + fmt(bB) + "</span>" : "") + "</span></div>" +
        '<div class="track" style="height:' + (bB ? 28 : 16) + 'px"><div class="zero" style="left:' + pos(0) + '%"></div>' + row(bA, "a", "t1") + (bB ? row(bB, "b", "t2") : "") + "</div></div>";
    }).join("") + axisHTML(lo, hi, pos, unit) + '<div class="small muted" style="margin-top:6px">Momento en ' + (S.perKg ? "N·m por kg de masa corporal" : "newton metro (N·m)") + ". Barra: mediana. Línea: 95 % de las variaciones simuladas." +
      (bB ? ' Azul: ' + ctx.t.name + ". Contorno naranja: " + ctx.tB.name + "." : "") + "</div>";
  }

  function chartHTML() {
    const W = 600, Hh = 290, L = 62, R = 74, T = 14, B = 58;
    const js = P.JOINTS, div = S.perKg ? ctx.raw.mass : 1, unit = S.perKg ? "N·m/kg" : "N·m";
    let lo = 0, hi = 1;
    ctx.curve.forEach((b) => { if (b) js.forEach((j) => { lo = Math.min(lo, b[j][1] / div); hi = Math.max(hi, b[j][1] / div); }); });
    const ticks = niceTicks(lo, hi, 4);
    lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
    const X = (s) => L + s * (W - L - R), Y = (v) => T + (1 - (v - lo) / (hi - lo)) * (Hh - T - B);
    let g = "";
    ticks.forEach((v) => { g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + nf(v, S.perKg ? 1 : 0) + "</text>"; });
    g += '<text x="14" y="' + ((T + Hh - B) / 2) + '" text-anchor="middle" transform="rotate(-90 14 ' + ((T + Hh - B) / 2) + ')">Momento (' + unit + ")</text>";
    [0, 0.25, 0.5, 0.75, 1].forEach((v) => { g += '<line class="grid" x1="' + X(v) + '" x2="' + X(v) + '" y1="' + (Hh - B) + '" y2="' + (Hh - B + 5) + '"/><text x="' + X(v) + '" y="' + (Hh - B + 19) + '" text-anchor="middle">' + Math.round(v * 100) + " %</text>"; });
    g += '<text x="' + ((L + W - R) / 2) + '" y="' + (Hh - 6) + '" text-anchor="middle">Recorrido (% desde ' + (exercise() === "squat" ? "de pie hasta el fondo" : "el suelo hasta el bloqueo") + ")</text>";
    const N = ctx.curve.length - 1, ends = [];
    js.forEach((j) => {
      const pts = ctx.curve.map((b, i) => b ? X(i / N).toFixed(1) + "," + Y(b[j][1] / div).toFixed(1) : null).filter(Boolean);
      if (!pts.length) return;
      g += '<polyline class="ln" style="stroke:' + JCOL[j] + '" points="' + pts.join(" ") + '"/>';
      const last = pts[pts.length - 1].split(",");
      ends.push({ j, x: parseFloat(last[0]), y: parseFloat(last[1]) });
    });
    ends.sort((p, q) => p.y - q.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
    ends.forEach((e) => { g += '<text style="fill:' + JCOL[e.j] + '" x="' + (e.x + 6) + '" y="' + (e.y + 4) + '">' + JN[e.j].replace("Zona ", "") + "</text>"; });
    g += '<line class="cur" id="curline" x1="' + X(S.s) + '" x2="' + X(S.s) + '" y1="' + T + '" y2="' + (Hh - B) + '"/>';
    return '<svg class="chart" viewBox="0 0 ' + W + " " + Hh + '" role="img" aria-label="Momento articular en newton metro a lo largo del recorrido">' + g + "</svg>";
  }

  function updateResults() {
    const t = ctx.t, tB = ctx.tB, a = ctx.a;
    let r = null, rB = null, err = false;
    try { r = P.solve(a, t, S.load, S.s); if (tB) rB = P.solve(a, tB, S.load, S.s); } catch (e) { if (e instanceof P.Infeasible) err = true; else throw e; }
    $d("#infeasible").hidden = !err;
    if (err) { $("#fig").innerHTML = ""; $("#stats").innerHTML = ""; $d("#bars").innerHTML = ""; $d("#diff").innerHTML = ""; $d("#takeaway").textContent = ""; $d("#share").innerHTML = ""; if (S.tab === "wi") $d("#wi-effect").innerHTML = ""; return; }
    if (tB) extendView(tB);
    const fr = S.plane === "front", figH = Math.round(ctx.view.YT * 1000 + 70);
    $("#fig").setAttribute("viewBox", "0 0 " + (fr ? Math.round(2 * FRONT.HW * 1000) : ctx.view.W) + " " + figH);
    $("#fig").innerHTML = fr ? drawFront(r, rB) : drawFigure(r, rB);
    $("#fignote").textContent = fr ? frontNote(r) : figNote(r);
    $("#fighelp").textContent = fr ? FRONT_HELP : SAG_HELP;
    $("#legtog").style.display = fr ? "none" : "";
    const bA = P.band(ctx.set, t, S.load, S.s);
    const bB = tB ? P.band(ctx.set, tB, S.load, S.s) : null;
    $d("#bars").innerHTML = barsHTML(bA, bB, r);
    const lost = bA.n < ctx.set.length ? '<div class="note warn small">En ' + nf((1 - bA.n / ctx.set.length) * 100, 0) + " % de las variaciones simuladas la postura no era alcanzable. El rango se calculó con el resto.</div>" : "";
    // estadísticas
    const drop = (r.bar[1]).toFixed(2);
    $("#stats").innerHTML = [
      ["Altura de la barra", nf(r.bar[1] * 100, 0) + " cm"],
      ["Tronco respecto a la vertical", r.trunk_deg < -0.5 ? nf(-r.trunk_deg, 0) + "° hacia atrás" : nf(r.trunk_deg, 0) + "°"],
      ["Centro de presión respecto al medio pie", nf(r.cop_x * 100, 0) + " cm (" + (r.cop_in_base ? "dentro" : "fuera") + ")"],
    ].map(([k, v]) => '<div class="stat"><b>' + v + "</b><span>" + k + "</span></div>").join("");
    if (!r.cop_in_base) $("#stats").innerHTML += '<div class="note warn small" style="grid-column:1/-1">El centro de presión queda fuera de la base del pie en este punto: el atleta no podría sostener esta postura con la barra en esa posición.</div>';
    const legs = r.shares;
    const top = Object.keys(legs).sort((x, y) => legs[y] - legs[x])[0];
    $d("#takeaway").innerHTML = "En este punto, la mayor parte de la demanda de pierna está en la " + JN[top].toLowerCase() + " (" + nf(legs[top] * 100, 0) + " %)." + lost;
    $d("#share").innerHTML = '<div class="share" role="img" aria-label="Reparto porcentual">' + ["tobillo", "rodilla", "cadera"].map((j) => '<span style="width:' + (legs[j] * 100) + "%;background:" + JCOL[j] + '"></span>').join("") + "</div>" +
      '<div class="share-leg">' + ["tobillo", "rodilla", "cadera"].map((j) => '<span><i class="dot" style="background:' + JCOL[j] + '"></i>' + JN[j] + " " + nf(legs[j] * 100, 0) + " %</span>").join("") + "</div>" +
      '<div class="small muted">Porción del momento total de pierna (en valor absoluto) que corresponde a cada articulación.</div>';
    // diferencia pareada
    if (tB) {
      const pd = P.pairedDiff(ctx.set, t, tB, S.load, S.s), div = S.perKg ? ctx.raw.mass : 1;
      $d("#diff").innerHTML = '<h3 style="margin-top:8px">' + tB.name + " menos " + t.name + '</h3><div class="diff">' + ["tobillo", "rodilla", "cadera", "lumbar"].map((j) => {
        const q = pd[j];
        return "<div>" + JN[j] + "<b>" + (q.median > 0 ? "+" : "") + nf(q.median / div, S.perKg ? 1 : 0) + " " + (S.perKg ? "N·m/kg" : "N·m") + "</b>es menor en " + nf(q.pLess * 100, 0) + " % de los casos</div>";
      }).join("") + "</div>";
    } else $d("#diff").innerHTML = "";
    if (S.tab === "wi") updateWhatIf(r, rB);
    const cl = $("#curline"); if (cl) { const W = 600, L = 62, R = 74; const x = L + S.s * (W - L - R); cl.setAttribute("x1", x); cl.setAttribute("x2", x); }
  }


  // ---------- modo explicar (el entrenador enseña en vivo)
  const ZONE = { tobillo: "las pantorrillas", rodilla: "los cuádriceps", cadera: "los glúteos y los isquiotibiales", lumbar: "la espalda baja" };
  const ZONE_SHORT = { tobillo: "Pantorrillas", rodilla: "Cuádriceps", cadera: "Glúteos e isquios", lumbar: "Espalda baja" };
  const ART_DE = { tobillo: "del tobillo", rodilla: "de la rodilla", cadera: "de la cadera", lumbar: "de la zona lumbar" };
  const ART_SOBRE = { tobillo: "el tobillo", rodilla: "la rodilla", cadera: "la cadera", lumbar: "la zona lumbar" };
  let playRaf = 0;
  function reduceMotion() { try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } }
  function stopPlay() { if (playRaf) { cancelAnimationFrame(playRaf); playRaf = 0; } const b = $("#x-play"); if (b) b.textContent = reduceMotion() ? "Siguiente momento" : "Reproducir"; }
  function kneePassS(a, t, load) {
    let lo = 0, hi = 1;
    try {
      for (let i = 0; i < 30; i++) {
        const mid = (lo + hi) / 2, q = P.solve(a, t, load, mid);
        if (q.bar[1] < q.joints.rodilla[1]) lo = mid; else hi = mid;
      }
    } catch (e) { if (!(e instanceof P.Infeasible)) throw e; return 0.4; }
    return (lo + hi) / 2;
  }
  function prepareExplain() {
    ctx.raw = getRaw(); ctx.a = P.fromRaw(ctx.raw); ctx.t = P.TECHNIQUES[S.tech]; ctx.tB = null;
    computeView();
    // escala común: mayor momento extensor de pierna en todo el recorrido (así las barras crecen y bajan al mover el recorrido)
    ctx.peak = 1;
    for (let i = 0; i <= 20; i++) {
      try { const m = P.solve(ctx.a, ctx.t, S.load, i / 20).moments; ctx.peak = Math.max(ctx.peak, m.tobillo, m.rodilla, m.cadera); } catch (e) { if (!(e instanceof P.Infeasible)) throw e; }
    }
    ctx.moments = ctx.t.exercise === "squat"
      ? [{ n: "De pie", s: 0 }, { n: "A mitad de bajada", s: 0.5 }, { n: "Fondo", s: 1 }]
      : [{ n: "Despegue", s: 0 }, { n: "La barra pasa la rodilla", s: kneePassS(ctx.a, ctx.t, S.load) }, { n: "Bloqueo", s: 1 }];
  }
  // «Dónde se siente»: solo cuentan las articulaciones de la pierna (la zona lumbar es aproximada y se muestra como referencia).
  function explainData(r) {
    const js = ["tobillo", "rodilla", "cadera", "lumbar"], legs = ["tobillo", "rodilla", "cadera"], pos = {};
    js.forEach((j) => { pos[j] = Math.max(0, r.moments[j]); });
    const mx = Math.max.apply(null, legs.map((j) => pos[j]));
    const heat = {}; js.forEach((j) => { heat[j] = Math.min(1, pos[j] / ctx.peak); });
    return { pos, heat, mx, weak: mx < 0.25 * ctx.peak, top: legs.slice().sort((x, y) => pos[y] - pos[x])[0] };
  }
  function ideaText(r, d) {
    if (d.weak) return "Aquí casi no hay palanca: el cuerpo queda apilado sobre los pies y buena parte del peso lo sostienen los huesos y otras estructuras pasivas, no los músculos.";
    const j = d.top, arm = r.arms[j] * 100, cm = nf(Math.abs(arm), 0);
    if (Math.abs(arm) < 4) return "Aquí trabajan " + ZONE[j] + " sobre todo por el peso del propio cuerpo: la barra pasa casi sobre " + ART_SOBRE[j] + " (" + cm + " cm).";
    const ahead = j === "rodilla" ? arm < 0 : arm > 0;
    return "La barra queda " + cm + " cm " + (ahead ? "por delante" : "por detrás") + " " + ART_DE[j] + ". Esa distancia es el brazo de palanca: cuanto mayor, más trabajan " + ZONE[j] + ".";
  }
  function viewExplain() {
    const t = P.TECHNIQUES[S.tech];
    return '<div class="xp"><section class="card xfig"><div class="hdr-row"><span class="eyebrow">' + t.name + ' · ' + nf(S.load, 0) + ' kg</span><span class="eyebrow" id="xhead"></span></div>' +
      '<p class="xhl" id="xzone"></p>' +
      '<svg class="fig xf" id="xfig" viewBox="0 0 1000 1900" role="img" aria-label="Figura grande del atleta con el brazo de palanca principal"></svg>' +
      '<div class="moments" id="moments"></div>' +
      '<div class="xplay"><button type="button" class="btn" id="x-play">' + (reduceMotion() ? "Siguiente momento" : "Reproducir") + '</button>' +
      '<button type="button" class="btn" id="x-back">Volver a los números</button></div>' +
      '<div class="sl"><label for="xsl" class="small"><b>Recorrido: <span id="xslv">' + Math.round(S.s * 100) + '</span> %</b></label><input type="range" id="xsl" min="0" max="1" step="0.005" value="' + S.s + '"></div></section>' +
      '<section class="card xtxt"><p class="xidea" id="xidea"></p>' +
      '<div><h3 style="margin-bottom:8px">Dónde se siente la carga</h3><div id="xzones"></div></div>' +
      '<details><summary>¿Qué es el brazo de palanca?</summary><p class="small muted" style="max-width:60ch;margin-top:6px">Es la distancia horizontal entre la línea de la barra (la plomada punteada) y una articulación. Con el mismo peso, a más distancia la articulación necesita más fuerza muscular para sostenerlo.</p></details>' +
      '<p class="small muted">Estimación del modelo con las medidas de este atleta. Sirve para explicar el movimiento, no para medirlo. «Dónde se siente» es la demanda de cada articulación según el modelo; los músculos nombrados son los que la producen.</p></section></div>';
  }
  function updateExplain() {
    const t = ctx.t, a = ctx.a;
    let r = null;
    try { r = P.solve(a, t, S.load, S.s); } catch (e) { if (!(e instanceof P.Infeasible)) throw e; }
    const mo = $("#moments");
    if (mo) mo.innerHTML = ctx.moments.map((m, i) => '<button type="button" data-xm="' + i + '" aria-pressed="' + (Math.abs(S.s - m.s) < 0.012) + '">' + m.n + "</button>").join("");
    const sv = $("#xslv"); if (sv) sv.textContent = Math.round(S.s * 100);
    const sl = $("#xsl"); if (sl && Math.abs(parseFloat(sl.value) - S.s) > 1e-6) sl.value = S.s;
    if (!r) { $("#xfig").innerHTML = ""; $("#xhead").textContent = ""; $("#xzone").textContent = ""; $("#xidea").textContent = "Con estas medidas la postura no es alcanzable en este punto del recorrido."; $("#xzones").innerHTML = ""; return; }
    const d = explainData(r);
    const near = ctx.moments.find((m) => Math.abs(S.s - m.s) < 0.012);
    $("#xhead").textContent = near ? near.n : "Recorrido " + Math.round(S.s * 100) + " %";
    $("#xzone").textContent = d.weak ? "Poca carga en las piernas" : "Aquí se siente más: " + ZONE_SHORT[d.top].toLowerCase();
    $("#xidea").textContent = ideaText(r, d);
    $("#xfig").setAttribute("viewBox", "0 0 " + ctx.view.W + " " + Math.round(ctx.view.YT * 1000 + 70));
    $("#xfig").innerHTML = drawFigure(r, null, { heat: d.heat, only: !d.weak ? d.top : null, big: true });
    $("#xzones").innerHTML = ["cadera", "rodilla", "tobillo", "lumbar"].map((j) =>
      '<div class="zrow' + (j === d.top && !d.weak ? " top" : "") + '"><span class="zn">' + ZONE_SHORT[j] + (j === "lumbar" ? " (aprox.)" : "") + '</span><span class="zb"><i style="width:' + Math.round(d.heat[j] * 100) + '%"></i></span></div>').join("") +
      '<div class="small muted" style="margin-top:6px">Barra llena = la mayor demanda de las piernas en todo el recorrido. La espalda baja es una referencia aproximada.</div>';
  }
  function playExplain() {
    if (reduceMotion()) {
      const i = ctx.moments.findIndex((m) => Math.abs(S.s - m.s) < 0.012);
      S.s = ctx.moments[(i + 1) % ctx.moments.length].s; updateExplain(); return;
    }
    if (playRaf) { stopPlay(); return; }
    if (S.s >= 0.995) S.s = 0;
    const start = performance.now(), s0 = S.s, dur = 6000 * (1 - s0) + 400;
    $("#x-play").textContent = "Pausar";
    const step = (now) => {
      const k = Math.min(1, (now - start) / dur);
      S.s = s0 + (1 - s0) * k; updateExplain();
      if (k < 1 && playRaf) playRaf = requestAnimationFrame(step); else stopPlay();
    };
    playRaf = requestAnimationFrame(step);
  }

  // ---------- render principal
  function render() {
    renderSteps();
    const m = $("#main");
    stopPlay();
    m.innerHTML = [viewTech, viewAthlete, viewMeasures, S.explain ? viewExplain : viewResults][S.step]();
    window.scrollTo(0, 0);
    if (S.step === 2) { updateClosure(); document.querySelectorAll("[data-m]").forEach((el) => hint(el.dataset.m)); }
    if (S.step === 1) { hintAthlete(); }
    if (S.step === 3 && S.explain) { prepareExplain(); updateExplain(); }
    else if (S.step === 3) { prepareResults(); const ch = $("#chart"); if (ch) ch.innerHTML = chartHTML(); updateResults(); }
  }
  function estimMsg(k, v) {
    if (isFinite(v) || !isFinite(num(S.H))) return "";
    if (k === "D") return "Se usará una estimación de " + nf(0.143 * num(S.H), 1) + " cm.";
    if (k === "Wa" && S.tech === "peso_muerto_sumo") return "Si se omite, se usará una estimación de " + nf(WA_EST * num(S.H), 1) + " cm (no medida).";
    return "";
  }
  function hint(k) {
    const el = $("#h-" + k); if (!el) return;
    const v = num(S.m[k]);
    const msg = rangeHint(k, v);
    el.className = "hint" + (msg ? " warn" : "");
    el.textContent = msg || estimMsg(k, v);
  }
  function hintAthlete() {
    const hm = $("#h-mass"), hh = $("#h-H");
    const mv = num(S.mass), hv = num(S.H);
    if (hm) { const w = isFinite(mv) && (mv < 40 || mv > 160); hm.className = "hint" + (w ? " warn" : ""); hm.textContent = w ? "Fuera de lo habitual (40 a 160 kg)." : ""; }
    if (hh) { const w = isFinite(hv) && (hv < 140 || hv > 210); hh.className = "hint" + (w ? " warn" : ""); hh.textContent = w ? "Fuera de lo habitual (140 a 210 cm)." : ""; }
  }

  // ---------- eventos
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.go != null) { const i = +t.dataset.go; if (i <= S.step) { S.step = i; render(); } }
    else if (t.dataset.load) { S.load = Math.max(5, (S.load || 0) + +t.dataset.load); const el = $("#load"); if (el) el.value = S.load; save(); renderSteps(); }
    else if (t.id === "btn-sample") { S.sex = SAMPLE.sex; S.mass = SAMPLE.mass; S.H = SAMPLE.H; S.m = Object.assign({}, SAMPLE.m); S.controls = true; save(); render(); }
    else if (t.dataset.unit) { S.perKg = t.dataset.unit === "kg"; document.querySelectorAll("[data-unit]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.unit === t.dataset.unit))); const ch = $("#chart"); if (ch) ch.innerHTML = chartHTML(); updateResults(); }
    else if (t.id === "x-open") { S.explain = true; S.s = 0; render(); }
    else if (t.id === "x-back") { S.explain = false; render(); }
    else if (t.id === "x-play") { playExplain(); }
    else if (t.dataset.xm != null) { stopPlay(); S.s = ctx.moments[+t.dataset.xm].s; updateExplain(); }
    else if (t.dataset.lv) { S.legView = t.dataset.lv; document.querySelectorAll("[data-lv]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lv === t.dataset.lv))); updateResults(); }
    else if (t.dataset.plane) { S.plane = t.dataset.plane; document.querySelectorAll("[data-plane]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.plane === S.plane))); updateResults(); }
    else if (t.dataset.tab) { S.tab = t.dataset.tab; if (S.tab === "wi") S.compare = ""; refreshRight(); }
    else if (t.id === "wi-reset") { S.wi = {}; refreshRight(); }
  });
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el.id === "load") { S.load = num(el.value); save(); renderSteps(); }
    else if (el.id === "mass") { S.mass = el.value; hintAthlete(); save(); renderSteps(); }
    else if (el.id === "H") { S.H = el.value; hintAthlete(); save(); renderSteps(); }
    else if (el.dataset && el.dataset.m) { S.m[el.dataset.m] = el.value; hint(el.dataset.m); if (el.dataset.m === "Lf") hint("dam"); updateClosure(); save(); renderSteps(); }
    else if (el.id === "xsl") { stopPlay(); S.s = parseFloat(el.value); updateExplain(); }
    else if (el.id === "sl") { S.s = parseFloat(el.value); $("#slv").textContent = Math.round(S.s * 100); updateResults(); }
    else if (el.dataset && el.dataset.wi) {
      S.wi[el.dataset.wi] = parseFloat(el.value);
      const d = ctrlDefs().find((q) => q.id === el.dataset.wi); const lab = $("#wiv-" + el.dataset.wi); if (d && lab) lab.textContent = d.fmt(S.wi[d.id]);
      ctx.tB = modifiedTech(); ctx.curveB = null; updateResults();
    }
  });
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.name === "tech") { S.tech = el.value; S.compare = ""; S.wi = {}; save(); renderSteps(); }
    else if (el.name === "sex") { S.sex = el.value; save(); render(); }
    else if (el.id === "ctl") { S.controls = el.checked; save(); render(); }
    else if (el.id === "cmp") { S.compare = el.value; prepareResults(); updateResults(); }
  });
  $("#btn-back").addEventListener("click", () => { if (S.step > 0) { S.explain = false; S.step--; render(); } });
  $("#btn-next").addEventListener("click", () => {
    if (S.step === 3) { S.step = 0; S.s = 0; S.explain = false; S.compare = ""; S.wi = {}; S.tab = "res"; S.m = {}; S.mass = ""; S.H = ""; save(); render(); return; }
    if (stepValid(S.step)) { S.step++; if (S.step === 3) S.s = 0; render(); }
  });

  restore();
  render();
})();
</script>
