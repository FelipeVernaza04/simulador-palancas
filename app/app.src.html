<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de palancas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Concepto: herramienta de taller para entrenadores. Flujo de 4 pasos con una cinta métrica amarilla como indicador de avance;
   la figura de palitos muestra el brazo de palanca de la barra en cada articulación. Demanda en una sola gama (azul),
   sin verde/rojo de "bueno/malo". */
:root {
  --bg: #F1F3F4; --surface: #FFFFFF; --surface-2: #E8ECEE; --ink: #14202B; --muted: #55656F; --line: #D3DAE0;
  --accent: #F5C400; --on-accent: #1A1500;
  --demand: #1F6F8B; --demand-soft: #CFE3EA; --alt: #B4561F;
  --c-tob: #8A5A9E; --c-rod: #2A7F9E; --c-cad: #B4561F; --c-lum: #587D2B;
  --warn-bg: #FFF3CF; --warn-ink: #4A3A00; --bad-bg: #FBE3DE; --bad-ink: #6B1D10;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F161C; --surface: #17212A; --surface-2: #1F2C36; --ink: #E8EEF2; --muted: #9AABB8; --line: #2B3A46;
  --demand: #4DB3D4; --demand-soft: #1D3A47; --alt: #F08A4B;
  --c-tob: #B98FD0; --c-rod: #5BB8D9; --c-cad: #F08A4B; --c-lum: #9CCB5E;
  --warn-bg: #3A3010; --warn-ink: #F3DF9A; --bad-bg: #3F1D17; --bad-ink: #F6C3B8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F161C; --surface: #17212A; --surface-2: #1F2C36; --ink: #E8EEF2; --muted: #9AABB8; --line: #2B3A46;
  --demand: #4DB3D4; --demand-soft: #1D3A47; --alt: #F08A4B;
  --c-tob: #B98FD0; --c-rod: #5BB8D9; --c-cad: #F08A4B; --c-lum: #9CCB5E;
  --warn-bg: #3A3010; --warn-ink: #F3DF9A; --bad-bg: #3F1D17; --bad-ink: #F6C3B8; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-inline: 16px; padding-block: 0 96px; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 980px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.eyebrow { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* barra superior con cinta métrica */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 8px; margin-inline: -16px; padding-inline: 16px; }
.top-in { max-width: 980px; margin-inline: auto; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; }
.tape { position: relative; height: 14px; margin-block: 8px 6px; border-radius: 2px; overflow: hidden;
  background-color: var(--accent);
  background-image:
    repeating-linear-gradient(90deg, var(--on-accent) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(90deg, var(--on-accent) 0 1.5px, transparent 1.5px 30px);
  background-size: 100% 40%, 100% 70%; background-repeat: no-repeat; background-position: bottom left, bottom left; }
.tape i { position: absolute; top: 0; bottom: 0; right: 0; background: var(--bg); opacity: 0.78; transition: width .25s ease; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.steps button { background: none; border: 0; padding: 8px 2px; text-align: left; font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); letter-spacing: 0.02em; }
.steps button[aria-current="step"] { color: var(--ink); font-weight: 500; }
.steps button:disabled { opacity: 0.45; cursor: default; }

main { padding-block: 16px 24px; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.lead { color: var(--muted); max-width: 60ch; }

/* paso 1: técnicas */
.group-title { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.techs { display: grid; gap: 8px; }
.tech { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.tech:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--surface-2); }
.tech input { margin-top: 3px; accent-color: var(--ink); width: 18px; height: 18px; }
.tech .t-name { font-weight: 600; }
.tech .t-desc { grid-column: 2; color: var(--muted); font-size: 0.875rem; }
.badge { display: inline-block; font-family: var(--f-mono); font-size: 0.6875rem; padding: 2px 6px; border-radius: 3px; margin-left: 8px; vertical-align: 1px; letter-spacing: 0.02em; }
.badge.ok { background: var(--demand-soft); color: var(--ink); }
.badge.warn { background: var(--warn-bg); color: var(--warn-ink); }

/* formularios */
.field { display: grid; gap: 6px; }
.field > label, .field > .lbl { font-weight: 600; }
.help { color: var(--muted); font-size: 0.875rem; max-width: 58ch; }
.inp { display: flex; align-items: stretch; max-width: 220px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
.inp:focus-within { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.inp input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 12px; font-family: var(--f-mono); font-size: 1.125rem; font-variant-numeric: tabular-nums; outline: none; }
.inp .u { padding: 12px 12px 12px 0; color: var(--muted); font-family: var(--f-mono); align-self: center; }
.inp button { border: 0; background: var(--surface-2); width: 44px; font-size: 1.25rem; }
.hint { font-size: 0.8125rem; min-height: 1.1em; color: var(--muted); }
.hint.warn { color: var(--warn-ink); background: var(--warn-bg); padding: 2px 6px; border-radius: 3px; width: fit-content; }
.seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: fit-content; }
.seg label { padding: 12px 20px; cursor: pointer; background: var(--surface); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--ink); color: var(--bg); }
.seg label:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: 2px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.mfield { display: grid; gap: 6px; padding-block: 12px; border-top: 1px solid var(--line); }
.mfield:first-of-type { border-top: 0; padding-top: 0; }
.mname { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.mname .sym { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); }
.toggle { display: flex; gap: 10px; align-items: center; }
.toggle input { width: 20px; height: 20px; accent-color: var(--ink); }
.note { padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: 0.9rem; }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); }
.note.bad { background: var(--bad-bg); color: var(--bad-ink); }
.linkbtn { background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }
.btn { border: 1px solid var(--ink); background: var(--surface); border-radius: 8px; padding: 12px 18px; font-weight: 600; min-height: 48px; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--on-accent); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* barra de navegación inferior */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.nav-in { max-width: 980px; margin-inline: auto; display: flex; gap: 12px; justify-content: space-between; align-items: center; }
.nav .btn { min-width: 120px; }

/* resultados */
.res { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .res { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); align-items: start; } .fig-card { position: sticky; top: 120px; } }
.fig-card { padding: 12px; }
.fig { display: block; width: 100%; height: min(56vh, 520px); }
.fig text { font-family: var(--f-mono); font-size: 40px; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 10px; stroke-linejoin: round; }
.fig .dim { stroke: var(--ink); stroke-width: 5; }
.fig .plumb { stroke: var(--ink); stroke-width: 4; stroke-dasharray: 18 14; opacity: 0.8; }
.fig .seg-a { stroke: var(--ink); stroke-width: 26; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.fig .seg-b { stroke: var(--alt); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-dasharray: 24 18; }
.fig .floor { stroke: var(--muted); stroke-width: 6; }
.fig .plate { fill: var(--surface-2); stroke: var(--muted); stroke-width: 4; }
.fig .jt { stroke: var(--surface); stroke-width: 6; fill: var(--demand); }
.fig .lab { fill: var(--muted); font-size: 34px; }
.sl { display: grid; gap: 6px; }
.sl input[type=range] { width: 100%; height: 44px; accent-color: var(--ink); background: none; }
.sl-ends { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.stat b { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 1rem; overflow-wrap: anywhere; }
.stat span { font-size: 0.75rem; color: var(--muted); }
.cmp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cmp select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-width: 100%; }
.unit-tog { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.unit-tog button { border: 0; background: var(--surface); padding: 8px 12px; font-family: var(--f-mono); font-size: 0.8125rem; }
.unit-tog button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.hdr-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brow { display: grid; gap: 4px; padding-block: 8px; border-top: 1px solid var(--line); }
.brow:first-of-type { border-top: 0; }
.bl { display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: baseline; }
.bl .bv { margin-left: auto; text-align: right; }
.bl b { font-weight: 600; }
.bv { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 0.875rem; }
.bv small { color: var(--muted); font-size: 0.75rem; }
.track { position: relative; height: 26px; }
.track .zero { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink); opacity: 0.55; }
.track .bar { position: absolute; top: 4px; height: 8px; background: var(--demand); border-radius: 1px; }
.track .bar.b { top: 15px; background: none; border: 2px solid var(--alt); height: 8px; }
.track .wh { position: absolute; height: 2px; background: var(--ink); opacity: .7; }
.track .wh.t1 { top: 7px; } .track .wh.t2 { top: 18px; }
.track .cap { position: absolute; width: 2px; height: 10px; background: var(--ink); opacity: .7; }
.track .cap.t1 { top: 3px; } .track .cap.t2 { top: 14px; }
.axis { position: relative; height: 18px; border-top: 1px solid var(--line); margin-top: 4px; }
.axis span { position: absolute; top: 2px; transform: translateX(-50%); font-family: var(--f-mono); font-size: 0.6875rem; color: var(--muted); }
.axis-t { font-family: var(--f-mono); font-size: 0.6875rem; color: var(--muted); text-align: right; }
.share { display: flex; height: 22px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
.share span { display: block; height: 100%; }
.share-leg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8125rem; font-family: var(--f-mono); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--f-mono); font-size: 13px; fill: var(--muted); }
.chart .ln { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .cur { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 4; }
details summary { cursor: pointer; font-weight: 600; padding-block: 6px; }
details ul { margin: 8px 0 0; padding-left: 1.1em; display: grid; gap: 6px; color: var(--muted); font-size: 0.9rem; max-width: 64ch; }
.diff { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.diff div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 0.8125rem; }
.diff b { display: block; font-family: var(--f-mono); font-size: 0.9375rem; font-weight: 500; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.tabs button { border: 0; padding: 12px 8px; font-weight: 600; background: var(--surface); min-height: 48px; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.wi-ctl { display: grid; gap: 4px; padding-block: 10px; border-top: 1px solid var(--line); }
.wi-ctl:first-of-type { border-top: 0; }
.wi-ctl input[type=range] { width: 100%; height: 40px; accent-color: var(--ink); background: none; }
.wi-t { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
.wi-t th { text-align: left; font-family: var(--f-mono); font-size: 0.6875rem; font-weight: 500; color: var(--muted); padding: 4px 6px 6px 0; letter-spacing: 0.02em; }
.wi-t td { padding: 8px 6px 8px 0; border-top: 1px solid var(--line); font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.wi-t td:first-child { font-family: var(--f-body); font-weight: 600; }
.cue { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; background: var(--surface); }
.cue p { margin: 0; font-size: 0.9375rem; }
.cue .q { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; }
/* modo explicar */
.xp { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .xp { grid-template-columns: minmax(340px, 1.15fr) minmax(0, 1fr); align-items: start; } .xfig { position: sticky; top: 120px; } }
.fig.xf { height: min(50vh, 600px); }
.fig.xf .dim { stroke-width: 9; }
.fig.xf text { font-size: 50px; }
.fig.xf .tagtxt { font-family: var(--f-display); font-weight: 800; font-size: 58px; }
.moments { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.moments button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 6px; min-height: 52px; font-weight: 600; font-size: 0.875rem; line-height: 1.2; }
.moments button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.xplay { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.xhl { font-family: var(--f-display); font-weight: 800; font-size: 1.45rem; line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; }
.xidea { font-size: 1.15rem; line-height: 1.4; max-width: 46ch; }
.zrow { display: grid; grid-template-columns: 9.5em 1fr; gap: 10px; align-items: center; padding-block: 6px; }
.zrow .zn { font-weight: 500; }
.zrow.top .zn { font-weight: 800; }
.zb { display: block; height: 16px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.zb i { display: block; height: 100%; background: var(--demand); border-radius: 3px; }
@media (max-width: 520px) { .brand .eyebrow { display: none; } }
@media (prefers-reduced-motion: reduce) { .tape i { transition: none; } }
</style>

<div class="wrap">
  <header class="top"><div class="top-in">
    <div class="brand"><b>Simulador de palancas</b><span class="eyebrow">sentadilla · peso muerto</span></div>
    <div class="tape" aria-hidden="true"><i id="tape-rest"></i></div>
    <nav class="steps" id="steps" aria-label="Pasos"></nav>
  </div></header>
  <main id="main"></main>
</div>
<div class="nav"><div class="nav-in">
  <button class="btn" id="btn-back" type="button">Atrás</button>
  <button class="btn primary" id="btn-next" type="button">Siguiente</button>
</div></div>

<script>
(function () {
  "use strict";
  const P = Palancas;
  const $ = (s, r) => (r || document).querySelector(s);
  const $d = (s) => $(s) || document.createElement("div");
  const nf = (v, d) => { if (!isFinite(v)) return "—"; if (Number(v.toFixed(d)) === 0) v = 0; return v.toLocaleString("es", { minimumFractionDigits: d, maximumFractionDigits: d }); };
  const STORE = "palancas-v1";

  const TECH_INFO = {
    sentadilla_barra_alta: "Barra sobre el trapecio. Postura más estrecha y tronco más vertical.",
    sentadilla_barra_baja: "Barra bajo el trapecio. Postura más ancha y más inclinación del tronco.",
    sentadilla_frontal: "Barra apoyada por delante de los hombros. Valores ilustrativos, sin datos publicados para calibrar.",
    peso_muerto_convencional: "Pies bajo las caderas, agarre por fuera de las piernas.",
    peso_muerto_sumo: "Postura ancha, agarre por dentro de las piernas, barra más cerca del cuerpo.",
  };
  const GROUPS = [["Sentadilla", ["sentadilla_barra_alta", "sentadilla_barra_baja", "sentadilla_frontal"]],
                  ["Peso muerto", ["peso_muerto_convencional", "peso_muerto_sumo"]]];

  // medidas: clave -> [nombre, símbolo, ayuda, rango plausible (cm), grupo, solo peso muerto, control, opcional]
  const MEAS = {
    Lt: ["Muslo", "Lt", "Del trocánter mayor al epicóndilo lateral del fémur. El trocánter se palpa en el costado de la cadera y se mueve al rotar el muslo.", [30, 55], "Pierna"],
    Ls: ["Pierna", "Ls", "Del epicóndilo lateral a la punta del maléolo lateral, el hueso externo del tobillo.", [30, 55], "Pierna"],
    ha: ["Altura del maléolo", "ha", "Del suelo a la punta del maléolo lateral.", [4, 12], "Pierna"],
    Lf: ["Longitud del pie", "Lf", "Talón contra la pared, hasta la punta del dedo más largo.", [20, 32], "Pie"],
    dam: ["Talón al maléolo", "dam", "Talón contra la pared, escuadra apoyada en el borde del maléolo. Se lee la distancia horizontal.", [3, 9], "Pie"],
    Ltr: ["Tronco", "Ltr", "Del trocánter al acromion, el borde lateral de la repisa ósea del hombro. Hombros relajados.", [40, 65], "Tronco y brazo"],
    La: ["Brazo", "La", "Del acromion al centro del agarre, con la barra en la mano y el brazo colgando recto.", [45, 80], "Tronco y brazo", true],
    Wa: ["Ancho de hombros", "Wa", "Entre los dos acromiones (el borde lateral de cada hombro), con la cinta recta por la espalda y los hombros relajados. Define la separación de los tobillos: bajo los hombros.", [30, 55], "Tronco y brazo"],
    D: ["Distancia entre espinas ilíacas", "D", "Entre las dos puntas óseas del frente de la cadera, con la cinta recta. Opcional: si se omite se estima desde la estatura.", [18, 35], "Cadera", false, false, true],
    h_troc: ["Altura del trocánter", "h_troc", "Del suelo a la punta superior del trocánter. Sirve para comprobar las medidas de pierna.", [70, 110], "Control", false, true],
    h_acro: ["Altura del acromion", "h_acro", "Del suelo al acromion. Sirve para comprobar la medida del tronco.", [110, 170], "Control", false, true],
  };
  const SAMPLE = { sex: "M", mass: "80", H: "175", m: { Lt: "42", Ls: "43", ha: "7", Lf: "26", dam: "5", Ltr: "52", La: "62", Wa: "40", D: "25", h_troc: "92", h_acro: "144" } };

  const WA_EST = 0.23; // estimación propia del ancho de hombros / estatura (sin fuente verificada); solo si no se mide
  const JN = { tobillo: "Tobillo", rodilla: "Rodilla", cadera: "Cadera", lumbar: "Zona lumbar" };
  const JCOL = { tobillo: "var(--c-tob)", rodilla: "var(--c-rod)", cadera: "var(--c-cad)", lumbar: "var(--c-lum)" };

  let S = {
    step: 0, tech: "peso_muerto_sumo", load: 150, sex: "M", mass: "", H: "", m: {}, controls: false,
    s: 0, compare: "", perKg: false, tab: "res", wi: {}, legView: "lat", plane: "sag", explain: false,

  // ---------- persistencia ligera (solo comodidad)
  function save() { try { localStorage.setItem(STORE, JSON.stringify({ tech: S.tech, load: S.load, sex: S.sex, mass: S.mass, H: S.H, m: S.m, controls: S.controls })); } catch (e) {} }
  function restore() { try { const o = JSON.parse(localStorage.getItem(STORE) || "null"); if (o) Object.assign(S, o); } catch (e) {} }

  // ---------- utilidades de datos
  const num = (v) => { const x = parseFloat(String(v == null ? "" : v).replace(",", ".")); return isFinite(x) ? x : NaN; };
  const exercise = () => P.TECHNIQUES[S.tech].exercise;
  function neededKeys() {
    const ks = ["Lt", "Ls", "ha", "Lf", "dam", "Ltr"];
    if (exercise() === "deadlift") ks.push("La");
    if (S.tech !== "peso_muerto_sumo") ks.push("Wa");
    return ks;
  }
  function shownKeys() {
    const ks = neededKeys().concat(S.tech === "peso_muerto_sumo" ? ["Wa", "D"] : ["D"]);
    if (S.controls) ks.push("h_troc", "h_acro");
    return ks;
  }
  function rangeHint(key, v) {
    const r = MEAS[key][3];
    if (!isFinite(v)) return "";
    if (v < r[0] || v > r[1]) return "Fuera de lo habitual (" + r[0] + " a " + r[1] + " cm). Revisa la medida.";
    if (key === "dam" && isFinite(num(S.m.Lf)) && v >= num(S.m.Lf)) return "Debe ser menor que la longitud del pie.";
    return "";
  }
  function stepValid(i) {
    if (i === 0) return isFinite(S.load) && S.load > 0;
    if (i === 1) return isFinite(num(S.mass)) && num(S.mass) > 20 && isFinite(num(S.H)) && num(S.H) > 100;
    if (i === 2) return neededKeys().every((k) => isFinite(num(S.m[k])) && num(S.m[k]) > 0) && !(isFinite(num(S.m.dam)) && num(S.m.dam) >= num(S.m.Lf));
    return true;
  }
  function getRaw() {
    const c = (k) => num(S.m[k]) / 100;
    const H = num(S.H) / 100;
    return {
      sex: S.sex, mass: num(S.mass), H,
      Lt_raw: c("Lt"), Ls_raw: c("Ls"), ha: c("ha"), Lf: c("Lf"), heel_to_malleolus: c("dam"), Ltr_raw: c("Ltr"),
      La_raw: exercise() === "deadlift" ? c("La") : 0.60,
      D_asis: isFinite(c("D")) && c("D") > 0 ? c("D") : 0.143 * H,
      D_acro: isFinite(c("Wa")) && c("Wa") > 0 ? c("Wa") : WA_EST * H,
      h_troc: isFinite(c("h_troc")) && S.controls ? c("h_troc") : null,
      h_acro: isFinite(c("h_acro")) && S.controls ? c("h_acro") : null,
    };
  }

  // ---------- pasos
  const STEP_NAMES = ["Técnica", "Atleta", "Medidas", "Resultados"];
  function renderSteps() {
    $("#steps").innerHTML = STEP_NAMES.map((n, i) =>
      '<button type="button" data-go="' + i + '"' + (i === S.step ? ' aria-current="step"' : "") + (i > S.step ? " disabled" : "") + ">" + n + "</button>").join("");
    $("#tape-rest").style.width = (100 - ((S.step + 1) / 4) * 100) + "%";
    $("#btn-back").style.visibility = S.step === 0 ? "hidden" : "visible";
    const nx = $("#btn-next");
    nx.textContent = S.step === 2 ? "Ver resultados" : S.step === 3 ? "Nuevo atleta" : "Siguiente";
    nx.disabled = !stepValid(S.step);
  }

  function viewTech() {
    const groups = GROUPS.map(([g, keys]) => '<div class="group-title">' + g + '</div><div class="techs">' + keys.map((k) => {
      const t = P.TECHNIQUES[k];

      return '<label class="tech"><input type="radio" name="tech" value="' + k + '"' + (S.tech === k ? " checked" : "") + '>' +

    }).join("") + "</div>").join("");
    return '<section class="card"><div><h2>¿Qué técnica usa el atleta?</h2><p class="lead">El modelo usa los datos publicados de esa técnica para ubicar la barra y el cuerpo. No hace falta grabar ni subir video.</p></div>' +
      groups +

      '<div class="help">Barra, discos y collares. Para el cálculo se supone una carga estática y simétrica.</div></div></section>';
  }

  function viewAthlete() {
    return '<section class="card"><div><h2>Datos del atleta</h2><p class="lead">Estatura y masa definen las proporciones del cuerpo. El sexo selecciona las tablas de masa de los segmentos.</p></div>' +
      '<div class="field"><span class="lbl" id="sexlbl">Sexo</span><div class="seg" role="radiogroup" aria-labelledby="sexlbl">' +
      '<label><input type="radio" name="sex" value="M"' + (S.sex === "M" ? " checked" : "") + '>Hombre</label>' +

      '<div class="field"><label for="H">Estatura</label><div class="inp"><input id="H" inputmode="decimal" autocomplete="off" value="' + (S.H || "") + '"><span class="u">cm</span></div><div class="help">Espalda y talones contra la pared, mirada al frente.</div><div class="hint" id="h-H"></div></div></div>' +
      (S.sex === "F" ? '<div class="note warn">Las técnicas se calibraron con datos de hombres. Para mujeres el modelo usa las masas de segmento femeninas, pero los parámetros de postura no se han contrastado con datos de mujeres.</div>' : "") +

  function viewMeasures() {
    const keys = shownKeys();

    order.forEach((g) => {
      const ks = keys.filter((k) => MEAS[k][4] === g);
      if (!ks.length) return;
      html += '<div class="group-title">' + g + "</div>" + ks.map((k) => {
        const m = MEAS[k];
